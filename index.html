<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23252a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="A two-player road race card game based on Mille Bornes. Play on two phones or iPads with a 4-letter code.">
<title>Road to 1000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bowlby+One&family=Nunito:ital,wght@0,500;0,700;0,800;0,900;1,600&display=swap">
<link rel="stylesheet" href="game.css?v=8">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<script src="game-core.js?v=8"></script>
<script>
/* ---------- App state ---------- */
const APP_VERSION='5.3';
let mode=null;            // null (home) | 'local' | 'pass' | 'online'
let local=null;           // practice game state
let pass=loadJSON('rt1000-pass'); // pass-and-play game state (saved on this device)
let passView=null;        // seat whose cards are showing in pass-and-play; null = covered
let online=null;          // shared table state (the host owns the real copy)
let busy=false, showLog=false, sel=-1, aiTimer=null, joinErr='';
const net={role:null, code:'', clients:[], status:'idle', msg:'', hostRev:-1, everUp:false, presence:new Map(), seen:new Set(), timer:null, timer2:null};
function localKey(){
  let k=load('rt1000-key');
  if (!k){ k='d_'+Math.random().toString(36).slice(2)+Date.now().toString(36); save('rt1000-key',k); }
  return k;
}
const myKey=localKey();

function state(){ return mode==='local' ? local : mode==='pass' ? pass : online; }
function mySeat(s){
  if (mode==='local') return 'A';
  if (mode==='pass') return passView;
  if (!s?.seats) return null;
  return ['A','B'].find(x=>s.seats[x]?.key===myKey) || null;
}
function nameOf(seat, s){
  s = s || state();
  if (mode==='local') return seat==='A' ? 'You' : 'Robo';
  return s?.seats?.[seat]?.name || (seat==='A'?'Player 1':'Player 2');
}
function fmt(text, s){
  const me=mySeat(s);
  return esc(text||'').replace(/%([AB])/g,(_,x)=> x===me ? 'You' : esc(nameOf(x,s)));
}
function myName(){ const v=($('nm')?.value||load('rt1000-name')||'').trim().slice(0,20); if (v) save('rt1000-name',v); return v; }

/* ---------- Networking (public MQTT relays over secure websockets; no accounts) ---------- */
// Every message goes through two independent public relays at once, so either one being down is fine.
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const ALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newCode=()=>Array.from({length:4},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join('');
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const topic=k=>`roadto1000/v2/${net.code}/${k}`;
const linkUp=()=>net.clients.some(c=>c.connected);
function setStatus(st,msg=''){ net.status=st; net.msg=msg; render(); }
function updateStatus(){
  if (!net.role) return;
  const peerHere=[...net.presence.values()].some(Boolean);
  let st;
  if (!linkUp()) st = net.everUp ? 'lost' : (net.status==='error' ? 'error' : 'starting');
  else if (net.role==='host') st = peerHere ? 'connected' : 'waiting';
  else st = !online ? (net.status==='error' ? 'error' : 'starting') : peerHere ? 'connected' : 'waiting';
  if (st!==net.status || (st!=='error' && net.msg)){ net.status=st; if (st!=='error') net.msg=''; render(); }
}
function shutdown(){
  clearTimeout(net.timer); clearTimeout(net.timer2);
  for (const c of net.clients){ try{ if (c.connected) c.publish(topic(net.role==='host'?'hostp':'guestp'),'0',{retain:true,qos:1}); c.end(false); }catch(e){} }
  Object.assign(net,{role:null,code:'',clients:[],status:'idle',msg:'',hostRev:-1,everUp:false});
  net.presence=new Map(); net.seen=new Set();
}
function connectAll(onMsg,onConnect){
  if (typeof mqtt==='undefined'){ setStatus('error','Could not load the connection library. Check your internet and reload the page.'); return; }
  const mine = net.role==='host'?'hostp':'guestp', theirs = net.role==='host'?'guestp':'hostp';
  const subs = [topic(net.role==='host'?'up':'down'), topic(theirs)];
  net.clients = BROKERS.map(url=>{
    const c=mqtt.connect(url,{clientId:'rt1000_'+rid(),clean:true,reconnectPeriod:3000,connectTimeout:10000,keepalive:30,
      will:{topic:topic(mine),payload:'0',retain:true,qos:1}});
    c.on('connect',()=>{ net.everUp=true; c.subscribe(subs,{qos:1}); c.publish(topic(mine),'1',{retain:true,qos:1}); onConnect(c); updateStatus(); });
    c.on('message',(t,buf)=>{
      const s=buf.toString();
      if (t===topic(theirs)){ net.presence.set(c, s==='1'); updateStatus(); return; }
      let d; try{ d=JSON.parse(s); }catch(e){ return; }
      if (d && typeof d==='object') onMsg(d);
    });
    for (const ev of ['close','offline']) c.on(ev,()=>{ net.presence.set(c,false); updateStatus(); });
    c.on('error',()=>{});
    return c;
  });
  net.timer=setTimeout(()=>{ if (!linkUp()) setStatus('error','Could not reach the game relay. Check your internet connection. It will keep trying.'); },12000);
}
function publishAll(k,obj,retain=false){
  const s=JSON.stringify(obj);
  for (const c of net.clients){ try{ c.publish(topic(k),s,{qos:1,retain}); }catch(e){} }
}
function hostCommit(n){
  n.rev=(online?.rev||0)+1; online=n;
  save('rt1000-host',{code:net.code,state:online});
  publishAll('down',{t:'state',state:online},true);
  render();
}
function startHost(code, saved){
  const name=myName();
  shutdown();
  mode='online'; net.role='host'; net.code=code;
  online = saved || {...blankTable(), seats:{A:{key:myKey,name:name||'Player 1'}}};
  if (name && online.seats.A) online.seats.A.name=name;
  save('rt1000-host',{code,state:online}); save('rt1000-guest',null);
  setStatus('starting');
  connectAll(hostReceive, c=>c.publish(topic('down'),JSON.stringify({t:'state',state:online}),{qos:1,retain:true}));
}
function hostReceive(d){
  if (d.id){ if (net.seen.has(d.id)) return; net.seen.add(d.id); if (net.seen.size>500) net.seen=new Set([...net.seen].slice(-200)); }
  if (d.t==='hello'){
    const b=online.seats.B, key=String(d.key||'').slice(0,60);
    if (!key) return;
    if (b && b.key!==key){ publishAll('down',{t:'full',key}); return; }
    const n=clone(online); n.seats.B={key, name:String(d.name||'Player 2').slice(0,20)};
    hostCommit(n); return;
  }
  if (d.t==='act'){ const n=apply(online,'B',d.a||{}); hostCommit(n!==online ? n : clone(online)); return; }
  if (d.t==='deal' && online.phase!=='play' && !online.champion && online.seats.B){ hostCommit(dealHand(online)); return; }
  if (d.t==='newgame' && online.champion){ hostCommit(newGame(online)); return; }
}
function startGuest(code){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  if (code.length!==4){ joinErr='Game codes have 4 letters or numbers.'; render(); return; }
  const name=myName();
  if (!name){ joinErr='Type your name first.'; render(); $('nm')?.focus(); return; }
  joinErr=''; shutdown();
  mode='online'; net.role='guest'; net.code=code; online=null; net.hostRev=-1;
  save('rt1000-guest',{code}); save('rt1000-host',null);
  setStatus('starting');
  connectAll(guestReceive, c=>c.publish(topic('up'),JSON.stringify({t:'hello',key:myKey,name,id:rid()}),{qos:1}));
  net.timer2=setTimeout(()=>{ if (!online && net.role==='guest' && linkUp()) setStatus('error',`No game found with code ${code}. Check the code, and make sure the host has the game open.`); },10000);
}
function guestReceive(d){
  if (d.t==='state' && d.state && (d.state.rev||0)>net.hostRev){
    net.hostRev=d.state.rev||0; online=d.state;
    if (net.status==='error'){ net.status='starting'; net.msg=''; }
    updateStatus(); render(); return;
  }
  if (d.t==='full' && d.key===myKey){ setStatus('error','That game already has two players.'); }
}
document.addEventListener('visibilitychange',()=>{
  if (document.visibilityState!=='visible') return;
  for (const c of net.clients) if (!c.connected){ try{ c.reconnect(); }catch(e){} }
});

function act(a){
  const s=state(), seat=mySeat(s);
  if (!s || !seat) return;
  const n=apply(s,seat,a);
  if (n===s) return;
  sel=-1;
  if (mode==='local'){ local=n; render(); return; }
  if (mode==='pass'){ pass=n; if (n.phase==='play' && n.turn!==seat) passView=null; save('rt1000-pass',pass); render(); window.scrollTo(0,0); return; }
  if (net.role==='host'){ hostCommit(n); return; }
  if (!linkUp()){ toast('Not connected right now. Reconnecting…'); return; }
  online=n; render();
  publishAll('up',{t:'act',a,id:rid()});
}
function dealOrNew(kind){
  if (mode==='local'){ local = kind==='deal' ? dealHand(local) : newGame(local); render(); return; }
  if (mode==='pass'){ pass = kind==='deal' ? dealHand(pass) : newGame(pass); passView=null; save('rt1000-pass',pass); render(); window.scrollTo(0,0); return; }
  if (net.role==='host'){ if (!online.seats.B){ toast('Wait for the other player to join first.'); return; } hostCommit(kind==='deal' ? dealHand(online) : newGame(online)); return; }
  if (linkUp()) publishAll('up',{t:kind,id:rid()}); else toast('Not connected right now. Reconnecting…');
}

/* ---------- Rendering ---------- */
function render(){
  const app=$('app'), focus=document.activeElement?.id, nmv=$('nm')?.value, cdv=$('code')?.value, p1v=$('p1')?.value, p2v=$('p2')?.value;
  if (!mode) app.innerHTML=homeHTML();
  else if (mode==='online' && (!online || online.phase==='lobby')) app.innerHTML=lobbyHTML();
  else if (mode==='pass' && pass.phase==='play' && passView!==pass.turn) app.innerHTML=coverHTML(pass);
  else { if (mode==='pass' && !passView) passView='A'; app.innerHTML=tableHTML(state()); }
  const nm=$('nm'); if (nm) nm.value = nmv ?? (load('rt1000-name')||'');
  const p1=$('p1'); if (p1 && !p1.value) p1.value = p1v ?? (load('rt1000-name')||'');
  const p2=$('p2'); if (p2 && !p2.value) p2.value = p2v ?? (load('rt1000-p2')||'');
  const cd=$('code'); if (cd && cdv!=null) cd.value=cdv;
  if (focus && $(focus)) $(focus).focus();
  scheduleAI();
}
function connPill(){
  if (mode!=='online') return '';
  const them = net.role==='host' ? (online?.seats?.B?.name||'player 2') : (online?.seats?.A?.name||'the host');
  const map={starting:['wait','Connecting…'],waiting:['wait',net.role==='host'?`Waiting for ${esc(them)}`:`${esc(them)} is away`],connected:['go','Connected'],lost:['stop','Reconnecting…'],error:['stop','Not connected']};
  const [c,t]=map[net.status]||['wait','…'];
  return `<span class="status ${c}">${t}</span>`;
}
function topBar(){
  return `<div class="top"><span class="brand">Road to 1000</span><span class="row" style="align-items:center;gap:8px">${connPill()}<button class="ghost" data-act="home">Menu</button></span></div>`;
}
function homeHTML(){
  const h=loadJSON('rt1000-host'), g=loadJSON('rt1000-guest');
  const resume = h?.code ? `<button class="btn dark" data-act="resume-host">Go back to your game (code ${esc(h.code)})</button>`
               : g?.code ? `<button class="btn dark" data-act="resume-guest">Rejoin game ${esc(g.code)}</button>` : '';
  return `<div class="hero">${borne(1000).replace('<svg','<svg role="img" aria-label="Kilometre marker"')}<h1>Road to 1000</h1><p>A two-player road race card game, based on the French classic Mille Bornes.</p></div>
  <div class="choices">
    <div class="choice"><h2>Play together</h2><p>Each player opens this page on their own phone or iPad. One person hosts and shares the 4-letter code; the other joins with it. No accounts needed.</p>
      <div class="field"><label for="nm"><b>Your name</b></label><input id="nm" maxlength="20" autocomplete="nickname" placeholder="e.g. Uncle Brian"></div>
      <button class="btn" data-act="host">Host a game</button>
      <div class="joinrow"><label for="code" class="sr">Game code</label><input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="CODE"><button class="btn green" data-act="join">Join</button></div>
      ${joinErr?`<div class="err">${esc(joinErr)}</div>`:''}
      ${resume}
    </div>
    <div class="choice"><h2>Pass and play</h2><p>Two players share one iPad or phone. Cards are hidden while you hand it over.</p>
      <div class="field"><label for="p1"><b>Player 1</b></label><input id="p1" maxlength="20" autocomplete="off" placeholder="e.g. Uncle Brian"></div>
      <div class="field"><label for="p2"><b>Player 2</b></label><input id="p2" maxlength="20" autocomplete="off" placeholder="e.g. Ava"></div>
      <button class="btn" data-act="go-pass">Start pass and play</button>
      ${pass && pass.phase && pass.phase!=='lobby' && !pass.champion ? `<button class="btn dark" data-act="resume-pass">Continue ${esc(pass.seats?.A?.name||'')} vs ${esc(pass.seats?.B?.name||'')}</button>` : ''}
    </div>
    <div class="choice"><h2>Practice vs Robo</h2><p>Play against the computer on this device to learn the cards. Works offline too.</p><button class="btn dark" data-act="go-local">${local && local.phase!=='lobby' ? 'Continue practice' : 'Start practice'}</button></div>
  </div>
  ${rulesHTML()}
  ${disclaimerHTML()}<p class="ver">Version ${APP_VERSION}</p>`;
}
function lobbyHTML(){
  const s=online, link=location.href.split('#')[0];
  if (net.role==='guest'){
    let body;
    if (net.status==='error') body=`<div class="note">${esc(net.msg)}</div><button class="btn" data-act="resume-guest">Try again</button>`;
    else if (!s) body=`<div class="note">Connecting to game <b>${esc(net.code)}</b>…</div>`;
    else body=`<div class="seats"><div class="seat"><span class="lbl">Host</span><span class="who">${esc(s.seats.A?.name)}</span></div><div class="seat"><span class="lbl">You</span><span class="who">${esc(s.seats.B?.name||'')}</span></div></div>
      <div class="note">You're in! Either of you can deal.</div><button class="btn green" data-act="deal">Deal the cards</button>`;
    return topBar()+`<h2>Game ${esc(net.code)}</h2>${body}${rulesHTML()}`;
  }
  const b=s?.seats?.B;
  return topBar()+`<h2>Your game</h2>
    <div class="codebox"><span class="lbl">Game code</span><span class="code">${esc(net.code)}</span><span class="hint">Send the other player this link and code:</span><span class="link">${esc(link)}</span><button class="ghost" data-act="copy">Copy invite</button></div>
    ${net.status==='error'?`<div class="note">${esc(net.msg)}</div>`:''}
    <div class="seats"><div class="seat"><span class="lbl">Player 1 (you)</span><span class="who">${esc(s.seats.A?.name)}</span></div><div class="seat"><span class="lbl">Player 2</span><span class="who">${b?esc(b.name)+([...net.presence.values()].some(Boolean)?'':' (away)'):'Not here yet'}</span></div></div>
    ${b?`<div class="note">Both players are here. Either of you can deal.</div><button class="btn green" data-act="deal">Deal the cards</button>`:`<div class="note">Waiting for them to open the link, type their name and the code, and tap Join. Keep this page open.</div>`}
    ${rulesHTML()}`;
}

/* ---------- Events ---------- */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a=el.dataset.act;
  if (a==='home'){ mode=null; sel=-1; render(); window.scrollTo(0,0); return; }
  if (a==='go-pass'){
    const n1=($('p1')?.value||'').trim().slice(0,20), n2=($('p2')?.value||'').trim().slice(0,20);
    if (!n1 || !n2){ toast('Type both players\' names first.'); (!n1?$('p1'):$('p2'))?.focus(); return; }
    save('rt1000-p2',n2); if (!load('rt1000-name')) save('rt1000-name',n1);
    mode='pass'; passView=null;
    pass=dealHand({...blankTable(), seats:{A:{key:'p1',name:n1},B:{key:'p2',name:n2}}});
    save('rt1000-pass',pass); render(); window.scrollTo(0,0); return;
  }
  if (a==='resume-pass'){ if (pass){ mode='pass'; passView=null; render(); window.scrollTo(0,0); } return; }
  if (a==='reveal'){ if (mode==='pass'){ passView=pass.turn; sel=-1; render(); window.scrollTo(0,0); } return; }
  if (a==='go-local'){ mode='local'; if (!local || local.phase==='lobby') local=dealHand(blankTable()); render(); return; }
  if (a==='host'){ if (!myName()){ joinErr='Type your name first.'; render(); $('nm')?.focus(); return; } joinErr=''; startHost(newCode()); return; }
  if (a==='join'){ startGuest($('code')?.value); return; }
  if (a==='resume-host'){
    if (net.role==='host' && net.clients.length){ mode='online'; render(); return; }
    const h=loadJSON('rt1000-host'); if (h?.code) startHost(h.code, h.state); return;
  }
  if (a==='resume-guest'){
    if (net.role==='guest' && net.clients.length){ mode='online'; render(); return; }
    const g=loadJSON('rt1000-guest'); if (g?.code) startGuest(g.code); return;
  }
  if (a==='copy'){
    const text=`Let's play Road to 1000! Open ${location.href.split('#')[0]} and join with code ${net.code}`;
    navigator.clipboard?.writeText(text).then(()=>toast('Invite copied. Paste it in a text message.'),()=>toast('Copy failed. The code is '+net.code));
    return;
  }
  if (a==='log'){ showLog=!showLog; render(); return; }
  if (a==='pick'){ const i=+el.dataset.i; sel = sel===i ? -1 : i; render(); return; }
  if (a==='draw') return act({t:'draw'});
  if (a==='take') return act({t:'take'});
  if (a==='coup') return act({t:'coup'});
  if (a==='play') return playSelected(false);
  if (a==='play-confirm') return playSelected(true);
  if (a==='cancel-over'){ overAsk=-1; render(); return; }
  if (a==='discard') return act({t:'discard',i:sel});
  if (a==='deal' || a==='newgame') return dealOrNew(a);
});
document.addEventListener('keydown', e=>{
  if (e.target.id==='code' && e.key==='Enter'){ startGuest(e.target.value); return; }
  const el=e.target.closest?.('[role=button][data-act]');
  if (el && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); el.click(); }
});
document.addEventListener('input', e=>{ if (e.target.id==='code') e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });

/* ---------- Boot ---------- */
(function boot(){
  const code=(location.hash||'').slice(1).toUpperCase();
  render();
  if (/^[A-Z0-9]{4}$/.test(code)){ const c=$('code'); if (c) c.value=code; }
})();
</script>
</body>
</html>
